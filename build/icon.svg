<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.55" stop-color="#0c1d22"/>
      <stop offset="1" stop-color="#0b302b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e3e9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#132832"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="labelClip">
      <rect x="152" y="82" width="208" height="112" rx="12"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="ledGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#2dd4bf" stroke-opacity="0.20" stroke-width="3"/>

  <!-- paper label emerging from the top -->
  <g filter="url(#shadow)">
    <rect x="152" y="82" width="208" height="112" rx="12" fill="#ffffff"/>
    <g clip-path="url(#labelClip)">
      <g transform="rotate(-18 256 138)" fill="#0b1720">
        <rect x="86" y="72" width="380" height="20"/>
        <rect x="86" y="112" width="380" height="20"/>
        <rect x="86" y="152" width="380" height="20"/>
        <rect x="86" y="192" width="380" height="20"/>
      </g>
      <rect x="152" y="82" width="208" height="112" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>
  </g>

  <!-- printer body -->
  <g filter="url(#shadow)">
    <rect x="88" y="168" width="336" height="238" rx="34" fill="url(#body)"/>
    <rect x="112" y="146" width="288" height="48" rx="14" fill="#cbd5e1"/>
    <rect x="112" y="146" width="288" height="16" rx="8" fill="#eef2f6"/>

    <!-- control panel -->
    <rect x="120" y="206" width="112" height="26" rx="9" fill="url(#panel)"/>
    <circle cx="138" cy="219" r="6" fill="#2dd4bf"/>
    <rect x="154" y="215" width="44" height="8" rx="4" fill="#64748b"/>
    <rect x="206" y="215" width="16" height="8" rx="4" fill="#475569"/>

    <!-- status led -->
    <circle cx="382" cy="219" r="13" fill="#2dd4bf" filter="url(#ledGlow)"/>
    <circle cx="382" cy="219" r="7" fill="#5eead4"/>

    <!-- front output slot -->
    <rect x="112" y="296" width="288" height="52" rx="16" fill="url(#panel)"/>
    <rect x="132" y="306" width="248" height="32" rx="8" fill="#ffffff"/>
    <g fill="#0b1720">
      <rect x="150" y="314" width="8" height="16"/>
      <rect x="164" y="314" width="4" height="16"/>
      <rect x="174" y="314" width="10" height="16"/>
      <rect x="190" y="314" width="5" height="16"/>
      <rect x="201" y="314" width="12" height="16"/>
      <rect x="219" y="314" width="4" height="16"/>
      <rect x="229" y="314" width="8" height="16"/>
      <rect x="243" y="314" width="14" height="16"/>
      <rect x="263" y="314" width="5" height="16"/>
      <rect x="274" y="314" width="9" height="16"/>
      <rect x="289" y="314" width="4" height="16"/>
      <rect x="299" y="314" width="12" height="16"/>
      <rect x="317" y="314" width="7" height="16"/>
      <rect x="330" y="314" width="10" height="16"/>
      <rect x="346" y="314" width="5" height="16"/>
      <rect x="357" y="314" width="9" height="16"/>
    </g>

    <!-- feet -->
    <rect x="132" y="396" width="54" height="18" rx="8" fill="#94a3b8"/>
    <rect x="326" y="396" width="54" height="18" rx="8" fill="#94a3b8"/>
  </g>

  <!-- small zebra accent -->
  <g transform="rotate(-18 256 438)">
    <rect x="202" y="430" width="22" height="8" rx="4" fill="#0b1720"/>
    <rect x="232" y="430" width="22" height="8" rx="4" fill="#0b1720"/>
    <rect x="262" y="430" width="22" height="8" rx="4" fill="#0b1720"/>
    <rect x="292" y="430" width="22" height="8" rx="4" fill="#0b1720"/>
  </g>
</svg>
